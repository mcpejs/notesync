name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # 이 컨테이너는 실행마다 새로 만들고 버리는 테스트 전용 DB라 비밀번호를 평문으로 둔다 (실제 DB 비밀번호와 무관)
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: notesync_test
          MYSQL_USER: notesync_app
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_PASSWORD: ci-app-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ddl-auto=validate라 테이블을 만들지 않는다. 로컬과 같이 schema.sql을 직접 넣는다
      - name: Create schema
        env:
          MYSQL_PWD: ci-app-password
        run: mysql -h 127.0.0.1 -P 3306 -u notesync_app notesync_test < docs/schema.sql

      - name: Test server and CLI
        run: ./gradlew :test :cli:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests
            cli/build/reports/tests
